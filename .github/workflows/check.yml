name: Check application and Node API

on:
  pull_request:
  push:
    branches: [main, backend/vercel-testing]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/first_light_backend_test
